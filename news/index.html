<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血友姐妹会 - 新闻中心</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 冻结导航栏 -->
    <nav class="top-nav">
        <div class="logo-bar">
            <div class="logo-container">
                <img src="logo.png" alt="血友姐妹会" class="logo-img">
                <a href="../home/" style="text-decoration: none;">
                    <span class="logo-text" data-zh="血友姐妹会" data-en="Hemophilia Sisters">血友姐妹会</span>
                </a>
            </div>
            <div class="nav-controls">
                <div class="language-switch">
                    <button id="lang-zh" class="lang-btn active">中文</button>
                    <button id="lang-en" class="lang-btn">English</button>
                </div>
            </div>
        </div>
        <div class="nav-links">
            <a href="../home/" data-zh="主页" data-en="Home">主页</a>
            <a href="../map/" data-zh="地图" data-en="Map Tool">地图</a>
            <a href="https://ima.qq.com/wiki/?shareId=bdfa0317e16a8a3890ff9c7ac4811369bda5affce903b96b756f13693a5623a7" target="https://ima.qq.com/wiki/?shareId=bdfa0317e16a8a3890ff9c7ac4811369bda5affce903b96b756f13693a5623a7" data-zh="知识库" data-en="Knowledge Base">知识库</a>
            <a href="../period/" data-zh="月经估算" data-en="Period Calculator">月经估算</a>
            <a href="../education/" data-zh="科普" data-en="Education">科普</a>            
            <a href="../quiz/" data-zh="问卷" data-en="Questionnaires">问卷</a>
            <a href="../news/" data-zh="新闻" data-en="News">新闻</a>
            <a href="../contact/" data-zh="联系方式" data-en="Contact">联系方式</a>
        </div>
    </nav>

    <!-- 悬浮排序按钮 -->
    <div class="floating-sort">
        <button id="sort-toggle" class="sort-btn" title="切换排序">
            <span class="sort-icon">⇅</span>
            <span class="sort-text" data-zh="最新" data-en="Newest">最新</span>
        </button>
    </div>

    <main class="main">
        <div class="container">
            <!-- 搜索栏 -->
            <div class="search-bar-container">
                <button id="search-toggle" class="search-toggle" title="搜索">
                    <span class="search-icon">🔍</span>
                </button>
                <div id="search-panel" class="search-panel">
                    <input type="date" id="search-date-from" class="search-input search-date">
                    <span class="search-separator">~</span>
                    <input type="date" id="search-date-to" class="search-input search-date">
                    <div class="search-type-wrapper">
                        <button id="search-type-toggle" class="search-type-toggle">
                            <span data-zh="类型" data-en="Type">类型</span>
                            <span class="dropdown-arrow">▾</span>
                        </button>
                        <div id="search-type-dropdown" class="search-type-dropdown">
                            <!-- 复选框将动态生成 -->
                        </div>
                    </div>
                    <input type="text" id="search-keyword" class="search-input search-keyword" 
                           data-zh-placeholder="请输入关键字" data-en-placeholder="Enter keywords" placeholder="请输入关键字">
                    <button id="search-clear" class="search-clear" data-zh="清除" data-en="Clear">清除</button>
                    <button id="search-submit" class="search-submit" data-zh="搜索" data-en="Search">搜索</button>
                </div>
            </div>

            <div id="news-container" class="news-grid">
                <!-- 新闻内容将在这里动态加载 -->
            </div>

            <div class="pagination">
                <button id="prev-page" class="page-btn" disabled data-zh="上一页" data-en="Previous">上一页</button>
                <button id="page-selector" class="page-selector">
                    <span id="page-info">1 / 1</span>
                    <span class="page-dropdown-icon">▾</span>
                </button>
                <button id="next-page" class="page-btn" disabled data-zh="下一页" data-en="Next">下一页</button>
            </div>

            <!-- 页码选择器底部弹窗 -->
            <div id="page-picker-overlay" class="page-picker-overlay">
                <div class="page-picker-content">
                    <div class="page-picker-header">
                        <span class="page-picker-title" data-zh="选择页码" data-en="Select Page">选择页码</span>
                        <button class="page-picker-close" id="close-page-picker">&times;</button>
                    </div>
                    <div class="page-picker-grid" id="page-picker-grid">
                        <!-- 页码按钮将动态生成 -->
                    </div>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <span data-zh="加载中..." data-en="Loading...">加载中...</span>
            </div>
        </div>
    </main>

    <!-- 页脚备案信息 -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">
                <span data-zh="南昌市血之友公益协会" data-en="Nanchang Hemophilia Association">南昌市血之友公益协会</span>
                <span class="footer-separator">|</span>
                <span>xueyou.xyz</span>
            </p>
            <p class="footer-beian">
                <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">
                    ICP备案号：赣ICP备2025065719号-2
                </a>
            </p>
        </div>
    </footer>

    <!-- 图片预览模态框 -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modal-image" src="" alt="">
            <div class="image-info">
                <h3 id="image-title" class="image-title"></h3>
                <p id="image-description" class="image-description"></p>
            </div>
            <div class="modal-controls">
                <button id="download-btn" data-zh="下载" data-en="Download">下载</button>
                <div class="image-nav">
                    <button id="prev-image" data-zh="上一张" data-en="Previous">上一张</button>
                    <span id="image-counter">1 / 1</span>
                    <button id="next-image" data-zh="下一张" data-en="Next">下一张</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/news-loader.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
